# =============================================================================
# GaN test-calculation input for ikazuchix -- V_Ga (triple acceptor) and V_N
# (donor) native vacancies in wurtzite GaN.
#
# HOW TO USE THIS FILE
# ---------------------
# Every ENERGY value below (bulk/defect total energies, elemental
# references, delta_v) is a PLACEHOLDER chosen only to produce a
# plausible-looking, self-consistent test run -- it is NOT from a real
# VASP calculation. Structural values (lattice constants, internal
# parameter u, band gap) ARE real literature values; see the citation
# table in this session's chat reply for sources and confidence levels.
# Replace every "PLACEHOLDER" energy with your own VASP output before
# drawing any physical conclusion from this file's results.
#
# Supercell convention: 3x3x2 repetition of the 4-atom wurtzite
# conventional (hexagonal) cell -> 72 atoms (36 Ga + 36 N), matching
# examples/example_input.yaml. Structural parameters:
#   a = 3.189 Ang, c = 5.185 Ang (Schulz & Thiemann, Solid State
#       Commun. 23, 815 (1977); consistent with later XRD refinements,
#       e.g. a0 = 3.1892(9) Ang, c0 = 5.1850(5) Ang)
#   u = 0.377 (same reference) -- anion basis (1/3, 2/3, u)
# =============================================================================

# NOTE (0.1.0a2, docs/adr/0006): the charged-state 'energy' values were
# originally tuned against ikazuchix <= 0.1.0a1, whose Kumagai-Oba lattice
# term was ~10x too large. They were then shifted mechanically, per charge
# state, by E_KO(old) - E_KO(fixed), so every formation energy and CTL of
# this file is unchanged -- only the KO breakdown is now correct. They are
# still placeholders, not DFT results.

bulk:
  formula: GaN
  energy: -463.712          # eV -- PLACEHOLDER: DFT total energy of the 72-atom bulk supercell (VASP OUTCAR "energy(sigma->0)")
  num_atoms: 72
  composition: {Ga: 36, N: 36}

# Elemental references: E_ref = DFT total energy PER ATOM of each
# species' stable elemental phase, computed with the SAME ENCUT/
# k-point-density/pseudopotentials as everything else in this file.
#   Ga: bulk alpha-Ga (orthorhombic, Cmce, 8 atoms/cell) -- NOT liquid Ga;
#       alpha-Ga is the standard 0 K reference despite Ga's low (303 K)
#       melting point.
#   N : 1/2 * E(N2 molecule) in a large (>=15 Ang) non-periodic-image box,
#       spin-unpolarized (N2 ground state is a closed-shell singlet).
#       Converge the box size and the molecule's own bond length before
#       trusting this number -- the N2 triple bond is notoriously easy
#       to under/over-bind with GGA functionals.
elemental_references:
  Ga: -3.031      # eV/atom -- PLACEHOLDER (order-of-magnitude only)
  N: -8.328       # eV/atom -- PLACEHOLDER (order-of-magnitude only)

# Chemical potentials: Delta_mu_i, relative to elemental_references.
# Ga-rich / N-poor growth limit (Delta_mu_Ga = 0, i.e. Ga reservoir is
# metallic Ga; Delta_mu_N set by the host-stability equality
# x_Ga*mu_Ga + x_N*mu_N = E_bulk/N_formula_units). Run --dry-run or
# --stability-diagram after filling in real energies to confirm these
# satisfy check_chemical_potentials()'s host-stability / bound checks.
chemical_potentials:
  Ga: 0.000       # Ga-rich limit
  N: -1.521889    # PLACEHOLDER -- solved exactly from bulk.energy above so Check 1 (host stability) passes with zero residual; recompute from YOUR bulk.energy once real

band_structure:
  vbm: -2.500          # eV -- PLACEHOLDER: absolute VBM (raw DFT eigenvalue reference; arbitrary zero, whatever your OUTCAR/EIGENVAL uses)
  cbm: 0.940            # eV -- vbm + 3.44 (experimental GaN gap, see bandgap below)
  bandgap: 3.44          # eV -- experimental wurtzite GaN gap at 300 K (Vurgaftman & Meyer, J. Appl. Phys. 94, 3675 (2003); consistent with Muth et al., Appl. Phys. Lett. 71, 2572 (1997))
  fermi_level: -0.780     # eV -- PLACEHOLDER default reference E_F (absolute); mid-gap-ish, override per run with -f
  # Effective masses for --solve-fermi (dimensionless, x m0):
  #   m_e*: 0.20 (isotropic approx. of 0.18||c / 0.20 perp c)
  #   m_h*: 1.40 (measured DOS-like hole mass, p-type Hall)
  # Source: Vurgaftman & Meyer, J. Appl. Phys. 94, 3675 (2003)
  # [m_e]; Kyle et al., Phys. Rev. B 89, 041201(R) (2014) [m_h, from
  # Nh=8e17 cm^-3 Hall data]. Confidence: m_e high, m_h medium (a single
  # scalar cannot capture the true multi-band heavy/light/split-off
  # hole structure -- see equilibrium.py's module docstring for this
  # model's other approximations).
  effective_mass_e: 0.20
  effective_mass_h: 1.40

dielectric:
  # Static (ionic + electronic) dielectric tensor, from a bulk DFPT run
  # (LEPSILON=.TRUE., IBRION=8, LPEAD=.TRUE., on the small unit/primitive
  # cell -- NOT the defect supercell). eps_perp = eps_parallel = same
  # value along x and y (hexagonal symmetry); eps_parallel along z (c-axis).
  # Values below: eps_perp=9.5, eps_parallel=10.4, a standard
  # frequently-cited pair for wurtzite GaN at 300 K (e.g. as tabulated
  # in TU Wien's semiconductor parameter database, consistent in
  # magnitude with Barker & Ilegems, Phys. Rev. B 7, 743 (1973)).
  # Confidence: medium -- your own DFPT run is the authoritative source.
  tensor:
    - [9.5, 0.0, 0.0]
    - [0.0, 9.5, 0.0]
    - [0.0, 0.0, 10.4]

# Shared default supercell (all defects below use this unless a defect
# gives its own 'supercell' block). Vectors are a 3x3x2 repetition of
# the wurtzite conventional cell -- see the header comment for a, c, u.
supercell:
  lattice_vectors:
    a: [9.5670, 0.0000, 0.0000]
    b: [-4.7835, 8.2853, 0.0000]
    c: [0.0000, 0.0000, 10.3700]
  # Cation (Ga) site nearest the supercell centre -- used by V_Ga below.
  # V_N overrides this with the anion site (see its own charge_states).
  defect_position: [0.444444, 0.555556, 0.000000]

defects:
  # ---------------------------------------------------------------------
  # V_Ga: Ga vacancy, a well-known triple acceptor in GaN (e.g. Lyons &
  # Van de Walle, npj Comput. Mater. 3, 12 (2017)). Charge states 0/-1/-2/-3.
  # ---------------------------------------------------------------------
  - name: V_Ga
    defect_type: vacancy
    removed_atoms: {Ga: 1}
    charge_states:
      - charge: 0
        energy: -453.681        # eV -- PLACEHOLDER (tuned for an illustrative in-gap CTL ladder; see chat reply)
        potential_alignment: {delta_v: 0.00}   # always 0.0 for q=0 (no compensating background charge to align)
        degeneracy: 1
      - charge: -1
        energy: -455.444752        # eV -- PLACEHOLDER (tuned for an illustrative in-gap CTL ladder; see chat reply)
        potential_alignment: {delta_v: -0.031}  # eV -- PLACEHOLDER: V(defect, far)-V(bulk, far) from LOCPOT (LVHAR=.TRUE.)
        degeneracy: 2            # PLACEHOLDER: orbital/spin degeneracy of this charge state's ground state
      - charge: -2
        energy: -457.228006        # eV -- PLACEHOLDER (tuned for an illustrative in-gap CTL ladder; see chat reply)
        potential_alignment: {delta_v: -0.058}
        degeneracy: 1
      - charge: -3
        energy: -459.023764        # eV -- PLACEHOLDER (tuned for an illustrative in-gap CTL ladder; see chat reply)
        potential_alignment: {delta_v: -0.083}
        degeneracy: 4

  # ---------------------------------------------------------------------
  # V_N: N vacancy, the classic (and long-debated) shallow/deep donor in
  # GaN often invoked to explain unintentional n-type conductivity.
  # Charge states 0/+1.
  # ---------------------------------------------------------------------
  - name: V_N
    defect_type: vacancy
    removed_atoms: {N: 1}
    supercell:
      lattice_vectors:
        a: [9.5670, 0.0000, 0.0000]
        b: [-4.7835, 8.2853, 0.0000]
        c: [0.0000, 0.0000, 10.3700]
      defect_position: [0.444444, 0.555556, 0.188500]   # anion (N) site, u=0.377
    charge_states:
      - charge: 0
        energy: -450.862         # eV -- PLACEHOLDER (tuned so E_f > 0 across the gap; see chat reply)
        potential_alignment: {delta_v: 0.00}
      - charge: 1
        energy: -449.839752         # eV -- PLACEHOLDER (tuned for an illustrative in-gap CTL; see chat reply)
        potential_alignment: {delta_v: 0.045}  # eV -- PLACEHOLDER
